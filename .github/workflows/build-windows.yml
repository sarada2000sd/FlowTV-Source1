name: Build FlowTV Windows

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Windows platform scaffolding
        shell: pwsh
        run: |
          $scaffold = Join-Path $env:RUNNER_TEMP 'flowtv_platform_scaffold'
          if (Test-Path $scaffold) { Remove-Item $scaffold -Recurse -Force }
          flutter create --platforms=android,windows --org com.flowtv --project-name flowtv $scaffold
          Copy-Item (Join-Path $scaffold 'android') '.' -Recurse
          Copy-Item (Join-Path $scaffold 'windows') '.' -Recurse
          Copy-Item (Join-Path $scaffold '.metadata') '.\.metadata' -Force

      - name: Apply FlowTV Android PiP and Windows branding
        run: python tool/patch_platforms.py android windows

      - name: Resolve packages and generate app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart format lib test
          flutter test

      - name: Build release executable
        run: flutter build windows --release

      - name: Package the complete Windows app folder
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path (Join-Path $release 'flowtv.exe'))) {
            $exe = Get-ChildItem -Path $release -Filter '*.exe' | Select-Object -First 1
            if ($null -eq $exe) { throw 'Release executable was not found.' }
          }
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath 'FlowTV-Windows-x64.zip' -Force

      - name: Upload Windows app bundle
        uses: actions/upload-artifact@v4
        with:
          name: FlowTV-Windows-x64
          path: FlowTV-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $iscc)) {
            $found = Get-ChildItem -Path 'C:\Program Files', 'C:\Program Files (x86)' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $found) { $iscc = $found.FullName }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler (ISCC.exe) was not found after installation.' }
          & $iscc /DMyAppVersion=1.0.1 installer\FlowTV.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (!(Test-Path 'dist/FlowTV-Setup.exe')) { throw 'FlowTV-Setup.exe was not created.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FlowTV-Windows-Installer
          path: dist/FlowTV-Setup.exe
          if-no-files-found: error
          retention-days: 30
