name: flowtv
description: FlowTV is a cross-platform IPTV player with source-aware quality preferences, data-saving profiles and local playlist management.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  file_picker: ^10.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/flowtv_icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/icon/flowtv_icon.png
  windows:
    generate: true
    image_path: assets/icon/flowtv_icon.png
    icon_size: 256
